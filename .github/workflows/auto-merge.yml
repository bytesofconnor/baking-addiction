# Listens to pull_request only. A merge made with GITHUB_TOKEN does not
# start the push trigger on Deploy to Vercel, so that workflow also listens
# for a successful PR Checks run and deploys the squash commit.
# Native auto-merge waits for the ruleset's required checks (checks and
# content-guard). This job only arms the squash.

name: Auto-merge safe pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@v7

      - name: Read pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          VIEW=$(gh pr view "$PR_NUMBER" --json baseRefName,isDraft,headRepository)
          jq -n \
            --arg headRepo "$(jq -r '.headRepository.nameWithOwner // empty' <<<"$VIEW")" \
            --arg baseRepo "$GITHUB_REPOSITORY" \
            --arg baseRef "$(jq -r .baseRefName <<<"$VIEW")" \
            --argjson draft "$(jq -r .isDraft <<<"$VIEW")" \
            '{headRepo:$headRepo, baseRepo:$baseRepo, baseRef:$baseRef, draft:$draft}' \
            > "$RUNNER_TEMP/snapshot.json"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Arm auto-merge
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          SHA=""
          if [ -z "${PR_NUMBER}" ]; then
            echo "No pull request to merge"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DECISION=$(node .github/scripts/auto-merge-decision.mjs merge < "$RUNNER_TEMP/snapshot.json")
          echo "$DECISION"
          if [ "$(jq -r .merge <<<"$DECISION")" = "true" ]; then
            BEFORE=$(gh pr view "$PR_NUMBER" --json state,mergedAt,mergeCommit,mergedBy,autoMergeRequest)
            if [ "$(jq -r .state <<<"$BEFORE")" != "MERGED" ] && [ "$(jq -r '.autoMergeRequest == null' <<<"$BEFORE")" = "true" ]; then
              gh pr merge --auto --squash "$PR_NUMBER"
            fi
            AFTER=$(gh pr view "$PR_NUMBER" --json state,mergedAt,mergeCommit,mergedBy)
            jq -n \
              --arg eventName "pull_request" \
              --argjson before "$BEFORE" \
              --argjson after "$AFTER" \
              --argjson checksUpdatedAt null \
              '{
                eventName: $eventName,
                checksUpdatedAt: $checksUpdatedAt,
                before: {
                  state: $before.state,
                  mergedAt: $before.mergedAt,
                  mergeCommitOid: (if $before.mergeCommit == null then null else $before.mergeCommit.oid end),
                  mergedBy: (if $before.mergedBy == null then null else $before.mergedBy.login end)
                },
                after: {
                  state: $after.state,
                  mergedAt: $after.mergedAt,
                  mergeCommitOid: (if $after.mergeCommit == null then null else $after.mergeCommit.oid end),
                  mergedBy: (if $after.mergedBy == null then null else $after.mergedBy.login end)
                }
              }' > "$RUNNER_TEMP/deploy.json"
            DEPLOY=$(node .github/scripts/auto-merge-decision.mjs deploy < "$RUNNER_TEMP/deploy.json")
            echo "$DEPLOY"
            SHA=$(jq -r '.sha // empty' <<<"$DEPLOY")
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
    secrets: inherit
