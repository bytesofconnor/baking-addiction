# GITHUB_TOKEN merges do not start push workflows. The main ruleset waits
# for the checks and content-guard jobs, so this workflow runs again when
# PR Checks succeeds and then calls Deploy to Vercel with the merge commit.
# dependabot/fetch-metadata@v3 still publishes update-type. The log records
# it. The value is not a merge gate.

name: Auto-merge safe pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout default branch
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout pull request merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Read pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_FROM_EVENT}" ] && [ "${PR_FROM_EVENT}" != "null" ]; then
            N="${PR_FROM_EVENT}"
          elif [ -n "${HEAD_SHA}" ]; then
            N=$(gh pr list --search "${HEAD_SHA}" --state all --json number,headRefOid --jq ".[] | select(.headRefOid==\"${HEAD_SHA}\") | .number" | head -1)
          else
            N=""
          fi
          if [ -z "${N}" ]; then
            echo "No pull request for this run"
            echo "actor=" >> "$GITHUB_OUTPUT"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VIEW=$(gh pr view "$N" --json headRefName,baseRefName,isDraft,headRepository)
          USER_LOGIN=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${N}" --jq .user.login)
          ACTOR="$USER_LOGIN"
          if [ "$USER_LOGIN" = "dependabot[bot]" ] || [ "$USER_LOGIN" = "app/dependabot" ]; then
            ACTOR="dependabot[bot]"
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTOR" = "dependabot[bot]" ]; then
            ACTOR="dependabot[bot]"
          fi
          gh pr diff "$N" --name-only > "$RUNNER_TEMP/paths.txt"
          jq -n \
            --arg headRepo "$(jq -r .headRepository.nameWithOwner <<<"$VIEW")" \
            --arg baseRepo "$GITHUB_REPOSITORY" \
            --arg baseRef "$(jq -r .baseRefName <<<"$VIEW")" \
            --arg headRef "$(jq -r .headRefName <<<"$VIEW")" \
            --arg actor "$ACTOR" \
            --argjson draft "$(jq -r .isDraft <<<"$VIEW")" \
            --rawfile paths "$RUNNER_TEMP/paths.txt" \
            '{headRepo:$headRepo, baseRepo:$baseRepo, baseRef:$baseRef, headRef:$headRef, actor:$actor, draft:$draft, paths: ($paths | split("\n") | map(select(length>0)))}' \
            > "$RUNNER_TEMP/snapshot.json"
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"

      - name: Dependabot metadata
        id: metadata
        if: github.event_name == 'pull_request' && steps.pr.outputs.actor == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Dependabot update type
        if: github.event_name == 'pull_request' && steps.pr.outputs.actor == 'dependabot[bot]'
        run: echo "update-type=${{ steps.metadata.outputs.update-type }}"

      - name: Arm auto-merge
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHECKS_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          SHA=""
          if [ -z "${PR_NUMBER}" ]; then
            echo "No pull request to merge"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DECISION=$(node .github/scripts/auto-merge-decision.mjs merge < "$RUNNER_TEMP/snapshot.json")
          echo "$DECISION"
          if [ "$(jq -r .merge <<<"$DECISION")" = "true" ]; then
            BEFORE=$(gh pr view "$PR_NUMBER" --json state,mergedAt,mergeCommit,mergedBy)
            if [ "$(jq -r .state <<<"$BEFORE")" != "MERGED" ]; then
              gh pr merge --auto --squash "$PR_NUMBER"
            fi
            AFTER=$(gh pr view "$PR_NUMBER" --json state,mergedAt,mergeCommit,mergedBy)
            CHECKS="null"
            if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$CHECKS_UPDATED_AT" ]; then
              CHECKS=$(jq -n --arg t "$CHECKS_UPDATED_AT" '$t')
            fi
            jq -n \
              --arg eventName "$EVENT_NAME" \
              --argjson before "$BEFORE" \
              --argjson after "$AFTER" \
              --argjson checksUpdatedAt "$CHECKS" \
              '{
                eventName: $eventName,
                checksUpdatedAt: $checksUpdatedAt,
                before: {
                  state: $before.state,
                  mergedAt: $before.mergedAt,
                  mergeCommitOid: (if $before.mergeCommit == null then null else $before.mergeCommit.oid end),
                  mergedBy: (if $before.mergedBy == null then null else $before.mergedBy.login end)
                },
                after: {
                  state: $after.state,
                  mergedAt: $after.mergedAt,
                  mergeCommitOid: (if $after.mergeCommit == null then null else $after.mergeCommit.oid end),
                  mergedBy: (if $after.mergedBy == null then null else $after.mergedBy.login end)
                }
              }' > "$RUNNER_TEMP/deploy.json"
            DEPLOY=$(node .github/scripts/auto-merge-decision.mjs deploy < "$RUNNER_TEMP/deploy.json")
            echo "$DEPLOY"
            SHA=$(jq -r .sha <<<"$DEPLOY")
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
    secrets: inherit
