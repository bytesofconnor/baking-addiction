name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  content-guard:
    name: content-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run content guard
        run: .github/scripts/content-guard.sh

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prove PR body check rejects a missing section
        run: |
          set -euo pipefail
          if .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          BODY
          then
            echo "PR body check accepted a body without Blast Radius." >&2
            exit 1
          fi

      - name: Prove PR body check accepts the three sections
        run: |
          set -euo pipefail
          .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          ## Blast Radius
          x
          BODY

      - name: Check this PR body
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/pr-body-check.sh

      - name: Vercel ignore build
        run: bash scripts/vercel-ignore-build.test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          # Lint only files changed in this PR to avoid failing on pre-existing errors
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACM origin/main...HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting changed files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | xargs npx eslint --max-warnings=0
          else
            echo "No TypeScript/JavaScript files changed"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production
        run: npm run build
        env:
          # Dummy Convex URL for build — not connected to any deployment
          VITE_CONVEX_URL: https://preview-only-not-connected.convex.cloud

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Dummy Convex URL for preview server
          VITE_CONVEX_URL: https://preview-only-not-connected.convex.cloud

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
