name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  content-guard:
    name: content-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run content guard
        run: .github/scripts/content-guard.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          # Lint only files changed in this PR to avoid failing on pre-existing errors
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACM origin/main...HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting changed files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | xargs npx eslint --max-warnings=0
          else
            echo "No TypeScript/JavaScript files changed"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build production
        run: npm run build
        env:
          # Dummy Convex URL for build — not connected to any deployment
          VITE_CONVEX_URL: https://preview-only-not-connected.convex.cloud

      - name: Verify test auth bypass cannot ship
        run: .github/scripts/verify-bypass-safety.sh

      - name: Verify no default passwords in convex/
        run: .github/scripts/verify-no-default-passwords.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test
        env:
          # Dummy Convex URL for preview server
          VITE_CONVEX_URL: https://preview-only-not-connected.convex.cloud

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
