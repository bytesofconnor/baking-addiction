# typescript-eslint@8.72.0 peers typescript <6.1.0, and no published
# typescript-eslint release accepts TypeScript 7. Stay on TypeScript 6.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - 7.x

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
